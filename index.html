<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=6,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#12263a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WTC">
<title>WTC — straatnamen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="stijl.css">
</head>
<body>
<div id="map"></div>
<div id="status" class="pill">GPS zoeken…</div>

<div id="zoek">
  <input id="zoekveld" type="search" enterkeyhint="search" autocomplete="off"
         autocapitalize="none" spellcheck="false" placeholder="Zoek straat of gebouw">
  <ul id="treffers" class="pill" role="listbox"></ul>
</div>

<div id="fade" class="pill">
  <label for="op">Doorzicht kaart</label>
  <input id="op" type="range" min="0.25" max="1" step="0.05" value="1">
</div>

<div id="tools">
  <button id="btnPlan"   aria-pressed="false" title="Toon de plattegrond eronder" hidden>▦</button>
  <button id="btnFollow" aria-pressed="false" title="Volg mijn positie">◎</button>
  <button id="btnWake"   aria-pressed="false" title="Scherm aan houden">☀</button>
  <a class="knop" href="instellingen.html" title="Kaart uitlijnen">⚙</a>
</div>

<div id="slot">
  <form class="kaartje" id="slotform">
    <img src="icons/icon-192.png" alt="">
    <h1>WTC — straatnamen</h1>
    <p>De plattegrond is versleuteld. Geef het wachtwoord.</p>
    <input id="ww" type="password" inputmode="text" autocomplete="current-password"
           enterkeyhint="go" autocapitalize="characters" spellcheck="false"
           aria-label="Wachtwoord" placeholder="wachtwoord">
    <button type="submit" id="slotknop">Openen</button>
    <div id="slotfout" role="status"></div>
  </form>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-imageoverlay-rotated.js"></script>
<script src="kaartkern.js"></script>
<script>
/* Kaartpagina: gps, scherm aanhouden, zoeken. De rest staat in kaartkern.js. */

/* ------------------------------- GPS ------------------------------ */
const statusEl = document.getElementById('status');
melden = (t, k='') => { statusEl.textContent = t; statusEl.className = 'pill ' + k; };

let stip, ring, volgen = false, eerste = true;
const btnFollow = document.getElementById('btnFollow');

map.on('locationfound', e => {
  const st = dichtsteStraat(e.latlng);
  const waar = st && st.afstand < 60
             ? (st.afstand < 18 ? ' · ' + st.naam : ' · bij ' + st.naam) : '';
  melden('GPS ±' + Math.round(e.accuracy) + ' m' + waar, e.accuracy > 25 ? 'warn' : '');
  if (!stip){
    ring = L.circle(e.latlng, { radius:e.accuracy, color:'#1e7bff', weight:1,
                                fillColor:'#1e7bff', fillOpacity:.10 }).addTo(map);
    stip = L.circleMarker(e.latlng, { radius:7, color:'#fff', weight:2.5,
                                      fillColor:'#1e7bff', fillOpacity:1 }).addTo(map);
  } else {
    stip.setLatLng(e.latlng); ring.setLatLng(e.latlng).setRadius(e.accuracy);
  }
  if (eerste || volgen){ map.setView(e.latlng, eerste ? 18 : map.getZoom()); eerste = false; }
});
map.on('locationerror', e => {
  melden(window.isSecureContext ? 'Geen GPS: ' + e.message
                             : 'GPS vereist https — open de pagina via GitHub Pages', 'err');
});
const zoekGps = () => map.locate({ watch:true, enableHighAccuracy:true, maximumAge:2000, timeout:20000 });

btnFollow.onclick = () => {
  volgen = !volgen;
  btnFollow.setAttribute('aria-pressed', volgen);
  if (volgen && stip) map.setView(stip.getLatLng(), Math.max(map.getZoom(), 18));
};
map.on('dragstart', () => { if (volgen){ volgen = false; btnFollow.setAttribute('aria-pressed', false); } });
/* --------------------------- scherm aan --------------------------- */
let wakeSlot = null;
const btnWake = document.getElementById('btnWake');
btnWake.onclick = async () => {
  if (!('wakeLock' in navigator)) return melden('Scherm aan houden kan niet op dit toestel', 'warn');
  if (wakeSlot){ await wakeSlot.release(); wakeSlot = null; btnWake.setAttribute('aria-pressed', false); return; }
  try { wakeSlot = await navigator.wakeLock.request('screen'); btnWake.setAttribute('aria-pressed', true);
        wakeSlot.addEventListener('release', () => { wakeSlot = null; btnWake.setAttribute('aria-pressed', false); });
  } catch(e){ melden('Scherm aan houden geweigerd', 'warn'); }
};
document.addEventListener('visibilitychange', async () => {
  if (wakeSlot === null && btnWake.getAttribute('aria-pressed') === 'true' && document.visibilityState === 'visible')
    try { wakeSlot = await navigator.wakeLock.request('screen'); } catch(e){}
});
/* ------------------------------- zoeken ----------------------------- */
const zoekveld = document.getElementById('zoekveld');
const treffers = document.getElementById('treffers');
let flits = null;

function vulLijst(vraag){
  const q = vraag.trim().toLowerCase();
  const rijen = [];
  for (const s of straten)
    if (!q || s.naam.toLowerCase().includes(q)) rijen.push({ naam:s.naam, bij:'straat', doel:midden(s.delen[0]) });
  if (plan)
    for (const k of plan.features){
      const c = k.properties.code;
      if (!c || (q && !c.toLowerCase().includes(q))) continue;
      const uv = k.geometry.type === 'Point' ? k.geometry.coordinates : zwaartepunt(k.geometry.coordinates[0]);
      rijen.push({ naam:c, bij:'gebouw', doel:uv });
    }
  rijen.sort((a,b) => a.naam.localeCompare(b.naam, 'nl'));
  treffers.innerHTML = '';
  for (const r of rijen.slice(0, 40)){
    const li = document.createElement('li');
    li.tabIndex = 0;
    li.innerHTML = ontsmet(r.naam) + '<span class="bij">' + r.bij + '</span>';
    const ga = () => { springNaar(r.doel); sluitLijst(); };
    li.onclick = ga;
    li.onkeydown = e => { if (e.key === 'Enter') ga(); };
    treffers.appendChild(li);
  }
  treffers.classList.toggle('on', rijen.length > 0 && document.activeElement === zoekveld);
}

function springNaar(uv){
  const ll = punt(uv);
  map.setView(ll, Math.max(map.getZoom(), 19));
  if (flits) map.removeLayer(flits);
  flits = L.circleMarker(ll, { radius:16, color:'#ff8a00', weight:3, fill:false }).addTo(map);
  setTimeout(() => { if (flits){ map.removeLayer(flits); flits = null; } }, 4000);
}
const sluitLijst = () => { treffers.classList.remove('on'); zoekveld.blur(); };

zoekveld.addEventListener('input', () => vulLijst(zoekveld.value));
zoekveld.addEventListener('focus', () => vulLijst(zoekveld.value));
zoekveld.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ zoekveld.value = ''; sluitLijst(); }
  if (e.key === 'Enter' && treffers.firstChild) treffers.firstChild.click();
});
document.addEventListener('click', e => {
  if (!document.getElementById('zoek').contains(e.target)) treffers.classList.remove('on');
});
naOntsleutelen = zoekGps;
naVector = () => vulLijst('');

</script>
</body>
</html>
